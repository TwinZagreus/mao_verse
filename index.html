<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毛泽东诗词 · 诗意墨韵</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf6ed;
    --ink: #2c2416;
    --ink-soft: #4a3f2f;
    --ink-light: #8a7b65;
    --ink-faint: #c4b89a;
    --cinnabar: #c4342b;
    --gold: #b8955c;
    --transition-poem: cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    overflow-y: auto;
    height: 100vh;
    font-size: 16px;
  }

  body {
    font-family: 'Noto Serif SC', serif;
    background-color: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Paper Texture ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0; z-index: 0;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 300px 300px;
  }

  /* ── Atmospheric Washes ── */
  .wash {
    position: fixed; z-index: 0; pointer-events: none;
    border-radius: 50%; filter: blur(120px); opacity: 0.05;
  }
  .wash-1 { width: 600px; height: 400px; top: -8%; left: -12%; background: radial-gradient(ellipse, #c4a882 0%, transparent 70%); }
  .wash-2 { width: 500px; height: 350px; bottom: 5%; right: -10%; background: radial-gradient(ellipse, #b8a080 0%, transparent 70%); }

  /* ── Snappable Sections ── */
  .snap-section {
    min-height: 100vh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    padding: 3rem 2rem 300px;
  }

  .snap-inner {
    max-width: 680px;
    width: 100%;
  }

  /* ── Hero (Cover Page) ── */
  .hero { text-align: center; }
  .hero-overline {
    font-size: 0.8rem; letter-spacing: 0.5em; color: var(--ink-light);
    opacity: 0; transform: translateY(16px);
    animation: revealUp 1s var(--transition-poem) forwards;
  }
  .hero-title {
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    color: var(--ink); letter-spacing: 0.08em; line-height: 1.25;
    margin: 0.5rem 0 0;
    opacity: 0; transform: translateY(24px);
    animation: revealUp 1s var(--transition-poem) 0.15s forwards;
  }
  .hero-sub {
    font-size: 1rem; color: var(--ink-light); letter-spacing: 0.6em; margin-top: 0.8rem;
    opacity: 0; transform: translateY(16px);
    animation: revealUp 1s var(--transition-poem) 0.3s forwards;
  }
  /* ── Search Box ── */
  .search-box {
    display: inline-flex;
    align-items: center;
    margin-top: 2rem;
    border-bottom: 1px solid var(--ink-faint);
    padding: 0.35rem 0;
    transition: border-color 0.3s;
    max-width: 400px;
    width: 80%;
  }
  .search-box:focus-within {
    border-color: var(--cinnabar);
  }
  .search-icon {
    font-size: 0.85rem;
    color: var(--ink-faint);
    margin-right: 0.5rem;
    flex-shrink: 0;
    opacity: 0.6;
  }
  .search-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Noto Serif SC', serif;
    font-size: 0.95rem;
    color: var(--ink);
    outline: none;
    letter-spacing: 0.05em;
    min-width: 0;
  }
  .search-input::placeholder {
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }
  .search-clear {
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 0 0.2rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .search-clear.visible {
    opacity: 0.6;
    pointer-events: auto;
  }
  .search-clear:hover { opacity: 1; color: var(--cinnabar); }
  .search-count {
    font-size: 0.75rem;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    margin-top: 0.6rem;
    height: 1.2em;
  }

  .hero-hint {
    position: absolute;
    bottom: 2.5rem; left: 50%; transform: translateX(-50%);
    font-size: 0.75rem; color: var(--ink-faint); letter-spacing: 0.2em;
    animation: hintFloat 2s ease-in-out infinite;
  }
  @keyframes hintFloat {
    0%, 100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
    50% { opacity: 0.8; transform: translateX(-50%) translateY(6px); }
  }
  @keyframes revealUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Poem Section ── */
  .poem-section { transition: opacity 0.4s; }
  .poem-section.snapped .poem-title-el   { animation: lineReveal 0.7s var(--transition-poem) forwards; }
  .poem-section.snapped .poem-line-el    { animation: lineReveal 0.6s var(--transition-poem) forwards; }
  .poem-section.snapped .poem-bg-el      { animation: lineReveal 0.7s var(--transition-poem) 0.3s forwards; }
  .poem-section.snapped .poem-meta-el    { animation: lineReveal 0.5s var(--transition-poem) forwards; }

  @keyframes lineReveal {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .poem-meta-el {
    display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem;
    opacity: 0;
  }
  .poem-category-tag {
    font-size: 0.7rem; letter-spacing: 0.2em; color: var(--cinnabar);
    border: 1px solid var(--cinnabar); padding: 0.1rem 0.55rem; opacity: 0.75;
  }
  .poem-date-el {
    font-size: 0.8rem; color: var(--ink-light); letter-spacing: 0.12em;
  }
  .poem-title-el {
    font-family: 'Noto Serif SC', serif; font-weight: 900;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    color: var(--ink); letter-spacing: 0.06em; line-height: 1.25;
    margin-bottom: 2rem; opacity: 0;
  }
  .poem-lines { margin-bottom: 2rem; }
  .poem-line-el {
    font-family: 'Noto Serif SC', serif; font-weight: 400;
    font-size: 1.25rem; color: var(--ink-soft); line-height: 2.4;
    letter-spacing: 0.05em; padding: 0.08rem 0; opacity: 0;
  }
  .poem-bg-el {
    margin-top: 1.5rem; padding: 1.5rem 2rem;
    border-left: 2px solid var(--cinnabar);
    background: rgba(196, 52, 43, 0.025);
    font-size: 0.85rem; color: var(--ink-light); line-height: 2;
    letter-spacing: 0.04em; opacity: 0;
  }
  .poem-bg-label {
    font-size: 0.7rem; letter-spacing: 0.25em; color: var(--cinnabar);
    margin-bottom: 0.5rem; opacity: 0.8;
  }

  /* ── Page counter ── */
  .page-counter {
    position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
    font-size: 0.7rem; color: var(--ink-faint); letter-spacing: 0.15em;
  }

  /* ── Right Side Navigation ── */
  .side-nav {
    position: fixed; right: max(1.5rem, calc((100vw - 1100px) / 2 - 8rem));
    top: 6rem; z-index: 60; max-height: calc(100vh - 10rem);
    display: flex; flex-direction: column;
    width: 170px;
    opacity: 0;
    animation: revealUp 1s var(--transition-poem) 0.7s forwards;
  }

  /* scrollable poem list */
  .nav-scroll {
    position: relative; padding-left: 18px;
    overflow-y: auto; flex: 1;
    padding-right: 2px;
    list-style: none;
  }
  .nav-scroll::-webkit-scrollbar { width: 3px; }
  .nav-scroll::-webkit-scrollbar-track { background: transparent; }
  .nav-scroll::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 3px; }
  .nav-item {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.45rem 0; cursor: pointer; text-decoration: none;
    color: var(--ink-light); transition: all 0.35s var(--transition-poem);
    border: none; background: none; width: 100%; text-align: left;
    font-family: 'Noto Serif SC', serif; position: relative;
  }
  .nav-item:hover { color: var(--ink); }
  .nav-dot {
    width: 9px; height: 9px; border-radius: 50%;
    border: 1.5px solid var(--ink-faint); background: transparent;
    flex-shrink: 0; transition: all 0.4s var(--transition-poem);
    position: relative; z-index: 1;
  }
  .nav-item.active .nav-dot {
    border-color: var(--cinnabar); background: var(--cinnabar);
    box-shadow: 0 0 0 6px rgba(196, 52, 43, 0.1);
    animation: dotPulse 0.5s var(--transition-poem);
  }
  @keyframes dotPulse {
    0% { box-shadow: 0 0 0 0px rgba(196, 52, 43, 0.25); }
    100% { box-shadow: 0 0 0 6px rgba(196, 52, 43, 0.1); }
  }
  .nav-item.active { color: var(--ink); }

  /* Home nav item */
  .nav-home { margin-bottom: 0.2rem; }
  .nav-dot-home {
    width: 9px; height: 9px; border-radius: 0;
    border: none; background: transparent;
    font-size: 0.7rem; line-height: 9px; text-align: center;
    color: var(--ink-faint);
    display: flex; align-items: center; justify-content: center;
    transition: color 0.3s;
  }
  .nav-home:hover .nav-dot-home { color: var(--cinnabar); }
  .nav-divider {
    width: 100%; height: 1px;
    background: var(--ink-faint); opacity: 0.25;
    margin: 0.4rem 0 0.5rem;
  }

  .nav-title { font-size: 0.76rem; letter-spacing: 0.06em; line-height: 1.3; display: block; }
  .nav-year { font-size: 0.63rem; color: var(--ink-faint); letter-spacing: 0.08em; display: block; }

  /* ── Footer ── */
  .footer-section {
    text-align: center;
    padding: 2rem;
  }
  .footer-section p {
    color: var(--ink-faint); font-size: 0.75rem; letter-spacing: 0.25em;
  }

  /* ── Responsive ── */
  @media (max-width: 1000px) {
    .side-nav { right: 0.5rem; width: 140px; }
    .nav-title { font-size: 0.7rem; }
  }
  @media (max-width: 750px) {
    .side-nav {
      position: fixed; right: auto; top: auto; bottom: 0; left: 0;
      width: 100%; max-height: none; z-index: 60;
      background: linear-gradient(to top, var(--paper) 65%, transparent);
      padding: 0.6rem 0.8rem 0.8rem; backdrop-filter: blur(8px);
      flex-direction: row;
    }
    .nav-scroll {
      display: flex; gap: 0.25rem; overflow-x: auto;
      padding-left: 0; padding-bottom: 0.2rem;
      flex: 1;
    }
    .nav-scroll::before { display: none; }
    .nav-scroll::-webkit-scrollbar { height: 2px; }
    .nav-home { margin-bottom: 0; margin-right: 0.5rem; }
    .nav-divider {
      width: 1px; height: auto; min-height: 28px;
      margin: 0 0.4rem; align-self: center;
    }
    .nav-item {
      flex-shrink: 0; flex-direction: column; align-items: center;
      gap: 0.2rem; padding: 0.3rem 0.5rem; min-width: 62px;
      border-radius: 4px;
    }
    .nav-item.active { background: rgba(196, 52, 43, 0.04); }
    .nav-dot { width: 5px; height: 5px; }
    .nav-title { font-size: 0.65rem; text-align: center; white-space: nowrap; }
    .nav-year { font-size: 0.55rem; }
    .snap-section { padding: 3rem 1.2rem 7rem; }
    .poem-line-el { font-size: 1.1rem; }
    .hero-hint { bottom: 5rem; }
  }
  @media (max-width: 450px) {
    .hero-title { font-size: 2.5rem; }
    .poem-title-el { font-size: 1.4rem; }
    .poem-line-el { font-size: 1rem; line-height: 2.1; }
    .poem-bg-el { padding: 1rem 1rem; }
    .snap-section { padding: 2rem 1rem 6.5rem; }
  }
</style>
</head>
<body>

<div class="wash wash-1"></div>
<div class="wash wash-2"></div>

<!-- ══════ Hero / Cover Page ══════ -->
<section class="snap-section hero-section" id="hero">
  <div class="snap-inner hero">
    <h1 class="hero-title">在巨浪中学会游泳</h1>
    <p class="hero-sub">毛泽东诗词</p>
    <div class="search-box">
      <span class="search-icon">&#x1F50D;</span>
      <input class="search-input" id="searchInput" type="text" placeholder="搜诗词、正文、背景..." autocomplete="off">
      <button class="search-clear" id="searchClear" aria-label="清除">&#x2715;</button>
    </div>
    <p class="search-count" id="searchCount"></p>
  </div>
  <div class="hero-hint">↓ 向下滚动</div>
</section>

<!-- ══════ Poem sections rendered by JS ══════ -->
<div id="poemContainer"></div>

<!-- ══════ Footer ══════ -->
<section class="snap-section footer-section">
  <p>红色江山 · 诗意墨韵</p>
</section>

<!-- ══════ Right Navigation ══════ -->
<nav class="side-nav" id="sideNav">
  <button class="nav-item nav-home" id="navHome">
    <span class="nav-dot nav-dot-home">↑</span>
    <span>
      <span class="nav-title">回到顶部</span>
    </span>
  </button>
  <div class="nav-divider"></div>
  <div class="nav-scroll" id="navScroll"></div>
</nav>

<script>
(async function() {
  /* ── Fetch & Parse ── */
  let poems = [];
  try {
    const resp = await fetch('./poems.json');
    poems = await resp.json();
  } catch (err) {
    document.getElementById('poemContainer').innerHTML =
      '<section class="snap-section"><div class="snap-inner" style="text-align:center;color:var(--ink-light)">'
      + '<p>无法加载诗词数据，请确保 poems.json 文件存在</p></div></section>';
    return;
  }

  /* ── Sort by date ── */
  function parseDate(d) {
    const y = d.match(/(\d{4})/);
    const year = y ? parseInt(y[1]) : 9999;
    const mon = d.match(/-(\d{2})/) ? parseInt(d.match(/-(\d{2})/)[1]) :
                d.includes('春') ? 3 :
                d.includes('夏') ? 6 :
                d.includes('秋') ? 9 :
                d.includes('冬') ? 12 : 0;
    const day = d.match(/-(\d{2})[^-]*$/) ? parseInt(d.match(/-(\d{2})[^-]*$/)[1]) : 0;
    return year * 10000 + mon * 100 + day;
  }
  poems.sort((a, b) => parseDate(a.date) - parseDate(b.date));

  /* ── Unified render: poems + nav ── */
  const container = document.getElementById('poemContainer');
  const navScroll = document.getElementById('navScroll');
  let allSections = [];

  function renderPoemSection(p, i, total) {
    return `
      <section class="snap-section poem-section" id="poem-${p.id}" data-index="${i}">
        <div class="snap-inner">
          <div class="poem-meta-el" style="animation-delay:${0.05}s">
            <span class="poem-category-tag">${p.category}</span>
            <span class="poem-date-el">${p.date}</span>
          </div>
          <h2 class="poem-title-el" style="animation-delay:${0.1}s">${p.title}</h2>
          <div class="poem-lines">
            ${p.content.map((line, li) =>
              `<div class="poem-line-el" style="animation-delay:${0.15 + li * 0.06}s">${line}</div>`
            ).join('')}
          </div>
          ${p.background ? `
          <div class="poem-bg-el">
            <div class="poem-bg-label">创 作 背 景</div>
            ${p.background}
          </div>` : ''}
        </div>
        <div class="page-counter">${i + 1} / ${total}</div>
      </section>`;
  }

  function renderNavItem(p) {
    return `
      <li>
        <button class="nav-item" data-target="poem-${p.id}">
          <span class="nav-dot"></span>
          <span>
            <span class="nav-title">${p.title}</span>
            <span class="nav-year">${p.date}</span>
          </span>
        </button>
      </li>`;
  }

  function bindNavClicks() {
    navScroll.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        const el = document.getElementById(item.dataset.target);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      });
    });
  }

  function renderAll(list) {
    container.innerHTML = list.length === 0
      ? '<section class="snap-section"><div class="snap-inner" style="text-align:center;color:var(--ink-light);padding:4rem 0"><p style="font-size:1.5rem;margin-bottom:0.5rem">&#x1F50E;</p><p>未找到匹配的诗词</p><p style="font-size:0.8rem;margin-top:0.3rem">试试其他关键词</p></div></section>'
      : list.map((p, i) => renderPoemSection(p, i, list.length)).join('');
    navScroll.innerHTML = list.map(p => renderNavItem(p)).join('');
    bindNavClicks();
    allSections = document.querySelectorAll('.poem-section');
    updateNav();
    /* trigger snap animation for visible sections */
    requestAnimationFrame(() => {
      const active = getActiveIndex();
      allSections.forEach((s, i) => { s.classList.toggle('snapped', i === active); });
    });
  }

  /* ── Filter ── */
  function filterPoems(query) {
    if (!query.trim()) return poems;
    const q = query.trim().toLowerCase();
    return poems.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.content.some(l => l.toLowerCase().includes(q)) ||
      (p.background && p.background.toLowerCase().includes(q))
    );
  }

  /* ── Search input ── */
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  const searchCount = document.getElementById('searchCount');
  let debounceTimer;
  searchInput.addEventListener('input', () => {
    const val = searchInput.value;
    searchClear.classList.toggle('visible', val.length > 0);
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      const filtered = filterPoems(val);
      renderAll(filtered);
      searchCount.textContent = val.trim()
        ? `找到 ${filtered.length} 首`
        : '';
    }, 250);
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.classList.remove('visible');
    renderAll(poems);
    searchCount.textContent = '';
    searchInput.focus();
  });

  /* ── Home button ── */
  document.getElementById('navHome').addEventListener('click', () => {
    document.getElementById('hero').scrollIntoView({ behavior: 'smooth' });
  });

  /* ── Scroll Spy ── */
  const heroSection = document.getElementById('hero');

  function getActiveIndex() {
    let best = -1;
    let bestDist = Infinity;
    allSections.forEach((s, i) => {
      const rect = s.getBoundingClientRect();
      const center = rect.top + rect.height * 0.4;
      const dist = Math.abs(center - window.innerHeight * 0.35);
      if (dist < bestDist) { bestDist = dist; best = i; }
    });
    return best;
  }

  function updateNav() {
    const active = getActiveIndex();
    const items = navScroll.querySelectorAll('.nav-item');
    items.forEach((item, i) => {
      item.classList.toggle('active', i === active);
    });
    allSections.forEach((s, i) => {
      s.classList.toggle('snapped', i === active);
    });
  }

  /* Trigger hero animation immediately */
  setTimeout(updateNav, 200);

  /* Use both scroll and IntersectionObserver for reliability */
  let ticking = false;
  document.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(() => { updateNav(); ticking = false; });
      ticking = true;
    }
  }, { passive: true });

  /* Arrow key navigation */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      e.preventDefault();
      const active = getActiveIndex();
      const next = Math.min(active + 1, allSections.length - 1);
      if (next >= 0) allSections[next].scrollIntoView({ behavior: 'smooth' });
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const active = getActiveIndex();
      if (active <= 0) {
        heroSection.scrollIntoView({ behavior: 'smooth' });
      } else {
        allSections[active - 1].scrollIntoView({ behavior: 'smooth' });
      }
    }
  });

  /* ── Initial render ── */
  renderAll(poems);
  updateNav();
})();
</script>
</body>
</html>
